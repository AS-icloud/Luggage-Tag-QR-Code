<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Luggage contact - Ankit Srivastava</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font:16px/1.45 system-ui,-apple-system,sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px}.hero,.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 8px 28px #24324a18}.hero{background:#101827;color:#fff}.hero h1{margin:0 0 6px}.muted{color:#667085}.hero .muted{color:#b8c1d1}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar label{font-weight:800}.toolbar select{font:inherit;padding:10px 12px;border:1px solid #ccd3df;border-radius:10px;background:#fff}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.column-title{margin:0 0 12px;font-size:20px}.row{padding:12px 0;border-top:1px solid #e6e9ef}.row:first-of-type{border:0}.label{font-size:12px;font-weight:800;text-transform:uppercase;color:#667085}.value{white-space:pre-line;font-weight:600;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn{display:inline-block;text-decoration:none;background:#1677ff;color:#fff;border:0;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.green{background:#138a55}.note{background:#fff8dc;border-left:5px solid #f5b700}.copy{width:100%;border:0;background:#5b4fd1;color:#fff;padding:13px;border-radius:11px;font-weight:800;font-size:16px;cursor:pointer}.copy.secondary{background:#087f5b;margin-top:10px}@media(max-width:760px){.columns{grid-template-columns:1fr}.wrap{padding:12px}}
  </style>
</head>
<body><main class="wrap">
  <section class="hero"><h1>Ankit Srivastava</h1><div class="muted">Luggage contact information / Multilingual travel contact</div></section>
  <section class="card toolbar"><label for="language">Translated column</label><select id="language" onchange="renderTranslation()"><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select><span class="muted">Contact values remain unchanged for accuracy.</span></section>
  <div class="columns">
    <section class="card" id="original"><h2 class="column-title">English / Original</h2></section>
    <section class="card" id="translated"><h2 class="column-title">Translation</h2></section>
  </div>
  <button class="copy" onclick="copyOriginal()">Copy original information</button>
  <button class="copy secondary" onclick="copyTranslated()">Copy translated information</button>
</main><script>
var data={name:'Ankit Srivastava',address1:'B/1\n9 Queens Crescent\nGlasgow, UK\nG4 9BW',address2:'KSkin\n11 Ingram Street\nGlasgow, UK\nG1 1HA',mobile:'+44 (0) 77 62 60 94 90',telephone:'+44 (0) 141 55 25 022',whatsapp:'+44 (0) 77 62 60 94 90',email1:'a_srivastava@icloud.com',email2:'home9crescent@gmail.com',note:'Please contact us via WhatsApp or email if you have found this luggage.'};
var languages={
  en:{title:'English / Original',name:'Name',address1:'Address 1',address2:'Address 2',mobile:'Mobile',telephone:'Telephone',whatsapp:'WhatsApp',email1:'Email 1',email2:'Email 2',note:'Notes',message:data.note,call:'Call',openWhatsApp:'Open WhatsApp',email:'Email',apple:'Apple Maps',google:'Google Maps'},
  es:{title:'Español',name:'Nombre',address1:'Dirección 1',address2:'Dirección 2',mobile:'Móvil',telephone:'Teléfono',whatsapp:'WhatsApp',email1:'Correo electrónico 1',email2:'Correo electrónico 2',note:'Nota',message:'Contacte con nosotros por WhatsApp o correo electrónico si ha encontrado este equipaje.',call:'Llamar',openWhatsApp:'Abrir WhatsApp',email:'Correo',apple:'Apple Maps',google:'Google Maps'},
  fr:{title:'Français',name:'Nom',address1:'Adresse 1',address2:'Adresse 2',mobile:'Portable',telephone:'Téléphone',whatsapp:'WhatsApp',email1:'E-mail 1',email2:'E-mail 2',note:'Remarque',message:'Veuillez nous contacter par WhatsApp ou e-mail si vous avez trouvé ce bagage.',call:'Appeler',openWhatsApp:'Ouvrir WhatsApp',email:'E-mail',apple:'Apple Plans',google:'Google Maps'},
  de:{title:'Deutsch',name:'Name',address1:'Adresse 1',address2:'Adresse 2',mobile:'Mobiltelefon',telephone:'Telefon',whatsapp:'WhatsApp',email1:'E-Mail 1',email2:'E-Mail 2',note:'Hinweis',message:'Bitte kontaktieren Sie uns per WhatsApp oder E-Mail, wenn Sie dieses Gepäck gefunden haben.',call:'Anrufen',openWhatsApp:'WhatsApp öffnen',email:'E-Mail',apple:'Apple Karten',google:'Google Maps'}
};
function digits(v){return v.replace(/\s*\(0\)\s*/,'').replace(/[^\d+]/g,'')}
function esc(v){return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function row(label,value,actions){return '<div class="row"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div>'+(actions?'<div class="actions">'+actions+'</div>':'')+'</div>'}
function renderColumn(target,lang){var t=languages[lang],map1=encodeURIComponent(data.address1),map2=encodeURIComponent(data.address2);var html='<h2 class="column-title">'+t.title+'</h2>';html+=row(t.name,data.name);html+=row(t.address1,data.address1,'<a class="btn" href="https://maps.apple.com/?q='+map1+'">'+t.apple+'</a><a class="btn" href="https://maps.google.com/maps?q='+map1+'">'+t.google+'</a>');html+=row(t.address2,data.address2,'<a class="btn" href="https://maps.apple.com/?q='+map2+'">'+t.apple+'</a><a class="btn" href="https://maps.google.com/maps?q='+map2+'">'+t.google+'</a>');html+=row(t.mobile,data.mobile,'<a class="btn green" href="tel:'+digits(data.mobile)+'">'+t.call+'</a>');html+=row(t.telephone,data.telephone,'<a class="btn green" href="tel:'+digits(data.telephone)+'">'+t.call+'</a>');html+=row(t.whatsapp,data.whatsapp,'<a class="btn green" href="https://wa.me/'+digits(data.whatsapp).replace(/\D/g,'')+'">'+t.openWhatsApp+'</a>');html+=row(t.email1,data.email1,'<a class="btn" href="mailto:'+data.email1+'">'+t.email+'</a>');html+=row(t.email2,data.email2,'<a class="btn" href="mailto:'+data.email2+'">'+t.email+'</a>');html+='<div class="card note" style="margin:14px 0 0"><strong>'+esc(t.message)+'</strong></div>';target.innerHTML=html}
function renderTranslation(){renderColumn(document.getElementById('translated'),document.getElementById('language').value)}
function clip(lang){var t=languages[lang];return [t.name+'\n'+data.name,t.address1+'\n'+data.address1,t.address2+'\n'+data.address2,t.mobile+': '+data.mobile,t.telephone+': '+data.telephone,t.whatsapp+': '+data.whatsapp,t.email1+': '+data.email1,t.email2+': '+data.email2,t.note+'\n'+t.message].join('\n\n')}
function copyText(text,message){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){alert(message)});else{var a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert(message)}}
function copyOriginal(){copyText(clip('en'),'Original information copied.')}function copyTranslated(){var l=document.getElementById('language').value;copyText(clip(l),languages[l].title+' translation copied.')}
renderColumn(document.getElementById('original'),'en');renderTranslation();
</script></body></html>
