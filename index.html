  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#luggage-point-designer { width:100%; color:var(--foreground); }
#luggage-point-designer [hidden] { display:none !important; }
#luggage-point-designer .lp-actions { justify-content:flex-start; margin-block:12px; }
#luggage-point-designer .lp-canvas { width:100%; }
#luggage-point-designer #lp-svg { width:100%; height:auto; display:block; touch-action:none; }
#luggage-point-designer .lp-selection { margin-top:12px; }
#luggage-point-designer .lp-qr-result { margin-block:12px; }
#luggage-point-designer .lp-selection .viz-stat-value { margin-block:4px; }
#luggage-point-designer .grid-line { stroke:var(--border); stroke-width:1; }
#luggage-point-designer .axis-line { stroke:var(--muted-foreground); stroke-width:1.5; }
#luggage-point-designer .shape-fill { fill:var(--card); stroke:var(--foreground); stroke-width:3; }
#luggage-point-designer .cut-line { stroke:var(--destructive); stroke-width:4; }
#luggage-point-designer .mirror-fill { fill:color-mix(in srgb, var(--viz-series-2) 12%, var(--card)); stroke:var(--viz-series-2); stroke-width:3; }
#luggage-point-designer .fold-line { stroke:var(--viz-series-3); stroke-width:3; stroke-dasharray:9 6; }
#luggage-point-designer .text-window { fill:var(--card); stroke:var(--viz-series-4); stroke-width:3; cursor:grab; }
#luggage-point-designer .text-window:active { cursor:grabbing; }
#luggage-point-designer .qr-recommendation { fill:url(#lp-qr-pattern); stroke:var(--viz-series-1); stroke-width:5; }
#luggage-point-designer .decor-fill { fill:url(#lp-decor-pattern); opacity:.45; }
#luggage-point-designer .cut-hatch { stroke:var(--destructive); stroke-width:2; }
#luggage-point-designer .perimeter-tick { stroke:var(--destructive); stroke-width:1.5; }
#luggage-point-designer .punch-mark { stroke:var(--destructive); stroke-width:2; }
#luggage-point-designer .lp-paper-status { margin-block:12px; }
#luggage-point-designer #lp-print-sheet { width:100%; height:auto; display:block; background:var(--card); border:1px solid var(--border); }
#luggage-point-designer .lp-assembly { margin-block:12px; }
@media print {
  body * { visibility:hidden !important; }
  #lp-print-sheet, #lp-print-sheet * { visibility:visible !important; }
  #lp-print-sheet { position:absolute; left:0; top:0; width:var(--lp-paper-w) !important; height:var(--lp-paper-h) !important; border:0; }
}
#luggage-point-designer .point { fill:var(--viz-series-1); stroke:var(--card); stroke-width:2; cursor:pointer; }
#luggage-point-designer .point-selected { fill:var(--destructive); }
#luggage-point-designer .hole { fill:var(--background); stroke:var(--viz-series-3); stroke-width:4; cursor:grab; }
#luggage-point-designer .hole:active { cursor:grabbing; }
#luggage-point-designer .point-label { fill:var(--foreground); font-size:12px; font-weight:500; pointer-events:none; }
#luggage-point-designer .coord-label { fill:var(--muted-foreground); font-size:10px; font-weight:400; pointer-events:none; }
#luggage-point-designer .axis-label { fill:var(--muted-foreground); font-size:11px; font-weight:400; }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;luggage-point-designer&#x27;);
  const svg=root.querySelector(&#x27;#lp-svg&#x27;);
  const grid=root.querySelector(&#x27;#lp-grid&#x27;);
  const art=root.querySelector(&#x27;#lp-art&#x27;);
  const el=id=&gt;root.querySelector(&#x27;#&#x27;+id);
  const state={points:[],selected:[],cut:null,overrides:{},unusedImage:null,dragHole:false,dragWindow:null,windowRects:{},windowConfig:{front:{relation:&#x27;below&#x27;,x:20,y:10,w:58,h:8},back:{relation:&#x27;below&#x27;,x:20,y:10,w:58,h:8}},views:null,view:{x:90,y:58,w:580,h:320},dimensions:{w:90,h:50}};
  const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const displayUnit=()=&gt;el(&#x27;lp-unit&#x27;).value;
  const fromInput=v=&gt;displayUnit()===&#x27;cm&#x27;?Number(v)*10:Number(v);
  const toInput=v=&gt;displayUnit()===&#x27;cm&#x27;?v/10:v;
  const fmt=v=&gt;`${toInput(v).toFixed(displayUnit()===&#x27;cm&#x27;?1:0)} ${displayUnit()}`;

  function dimensions(){
    const kind=el(&#x27;lp-shape&#x27;).value;
    if(kind===&#x27;square&#x27;){const s=fromInput(el(&#x27;lp-side&#x27;).value);return{w:s,h:s,kind};}
    if(kind===&#x27;circle&#x27;){const r=fromInput(el(&#x27;lp-radius&#x27;).value);return{w:r*2,h:r*2,r,kind};}
    return{w:fromInput(el(&#x27;lp-width&#x27;).value),h:fromInput(el(&#x27;lp-height&#x27;).value),kind};
  }

  function perimeterPoints(d){
    const out=[];
    if(d.kind===&#x27;circle&#x27;){
      const circumference=2*Math.PI*d.r;
      const count=Math.max(8,Math.round(circumference/10));
      for(let i=0;i&lt;count;i++){const a=-Math.PI/2+i*2*Math.PI/count;out.push({x:d.r+d.r*Math.cos(a),y:d.r+d.r*Math.sin(a)});}
      return out;
    }
    for(let x=0;x&lt;d.w;x+=10)out.push({x,y:0});
    out.push({x:d.w,y:0});
    for(let y=10;y&lt;d.h;y+=10)out.push({x:d.w,y});
    out.push({x:d.w,y:d.h});
    for(let x=d.w-10;x&gt;0;x-=10)out.push({x,y:d.h});
    out.push({x:0,y:d.h});
    for(let y=d.h-10;y&gt;0;y-=10)out.push({x:0,y});
    return out;
  }

  function mapIn(p,view){const d=state.dimensions,s=Math.min(view.w/d.w,view.h/d.h),left=view.x+(view.w-d.w*s)/2,top=view.y+(view.h-d.h*s)/2;return{x:left+p.x*s,y:top+(d.h-p.y)*s,s};}
  function unmapIn(x,y,view){const d=state.dimensions,m=mapIn({x:0,y:d.h},view);return{x:(x-m.x)/m.s,y:d.h-(y-m.y)/m.s};}
  function map(p){return mapIn(p,state.view);}
  function unmap(x,y){return unmapIn(x,y,state.view);}
  function svgPoint(evt){const p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}

  function retainedPolygon(points,a,b){
    const n=points.length,arc1=[];let i=a;while(true){arc1.push(points[i]);if(i===b)break;i=(i+1)%n;}
    const arc2=[];i=b;while(true){arc2.push(points[i]);if(i===a)break;i=(i+1)%n;}
    return arc1.length&gt;=arc2.length?arc1:arc2;
  }

  function pointInPolygon(p,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i&lt;poly.length;j=i++){
      const a=poly[i],b=poly[j];
      const cross=(p.y-a.y)*(b.x-a.x)-(p.x-a.x)*(b.y-a.y);
      if(Math.abs(cross)&lt;.001&amp;&amp;p.x&gt;=Math.min(a.x,b.x)-.001&amp;&amp;p.x&lt;=Math.max(a.x,b.x)+.001&amp;&amp;p.y&gt;=Math.min(a.y,b.y)-.001&amp;&amp;p.y&lt;=Math.max(a.y,b.y)+.001)return true;
      if(((a.y&gt;p.y)!==(b.y&gt;p.y))&amp;&amp;(p.x&lt;(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))inside=!inside;
    }
    return inside;
  }

  function rectInside(rect,poly){
    return [[rect.x,rect.y],[rect.x+rect.w,rect.y],[rect.x,rect.y+rect.h],[rect.x+rect.w,rect.y+rect.h],[rect.x+rect.w/2,rect.y+rect.h/2]].every(([x,y])=&gt;pointInPolygon({x,y},poly));
  }

  function circleHitsRect(hole,rect,pad=0){
    const nx=Math.max(rect.x-pad,Math.min(hole.x,rect.x+rect.w+pad)),ny=Math.max(rect.y-pad,Math.min(hole.y,rect.y+rect.h+pad));
    return (nx-hole.x)**2+(ny-hole.y)**2&lt;(hole.d/2+pad)**2;
  }

  function rectsOverlap(a,b,pad=0){return a.x&lt;b.x+b.w+pad&amp;&amp;a.x+a.w+pad&gt;b.x&amp;&amp;a.y&lt;b.y+b.h+pad&amp;&amp;a.y+a.h+pad&gt;b.y;}

  function windowForQr(q,relation,w,h,gap,customX,customY){
    if(relation===&#x27;custom&#x27;)return{x:customX,y:customY,w,h};
    if(relation===&#x27;overlap&#x27;)return{x:q.x+(q.w-w)/2,y:q.y+(q.h-h)/2,w,h};
    if(relation===&#x27;below&#x27;)return{x:q.x+(q.w-w)/2,y:q.y-gap-h,w,h};
    if(relation===&#x27;above&#x27;)return{x:q.x+(q.w-w)/2,y:q.y+q.h+gap,w,h};
    if(relation===&#x27;left&#x27;)return{x:q.x-gap-w,y:q.y+(q.h-h)/2,w,h};
    return{x:q.x+q.w+gap,y:q.y+(q.h-h)/2,w,h};
  }

  function bestQr(poly,hole,needWindow,relation,windowW,windowH,customX=0,customY=0){
    const d=state.dimensions,quiet=2,gap=2,max=Math.floor(Math.min(d.w,d.h)-quiet*2);
    for(let s=max;s&gt;=10;s-=1){
      for(let y=quiet;y+s&lt;=d.h-quiet+.01;y+=1){
        for(let x=quiet;x+s&lt;=d.w-quiet+.01;x+=1){
          const q={x,y,w:s,h:s},protectedBox={x:x-quiet,y:y-quiet,w:s+quiet*2,h:s+quiet*2};
          if(!rectInside(protectedBox,poly)||circleHitsRect(hole,protectedBox,.5))continue;
          const win=needWindow?windowForQr(q,relation,windowW,windowH,gap,customX,customY):null;
          if(win&amp;&amp;!rectInside(win,poly))continue;
          if(win&amp;&amp;relation!==&#x27;overlap&#x27;&amp;&amp;circleHitsRect(hole,win,.5))continue;
          if(win&amp;&amp;relation===&#x27;custom&#x27;&amp;&amp;rectsOverlap(q,win,gap))continue;
          return{q,win,quiet};
        }
      }
    }
    return{q:null,win:needWindow&amp;&amp;relation===&#x27;custom&#x27;?{x:customX,y:customY,w:windowW,h:windowH}:null,quiet};
  }

  function drawGrid(){
    let html=&#x27;&#x27;;
    for(let x=state.view.x;x&lt;=state.view.x+state.view.w;x+=58)html+=`&lt;line class=&quot;grid-line&quot; x1=&quot;${x}&quot; y1=&quot;${state.view.y}&quot; x2=&quot;${x}&quot; y2=&quot;${state.view.y+state.view.h}&quot;/&gt;`;
    for(let y=state.view.y;y&lt;=state.view.y+state.view.h;y+=53)html+=`&lt;line class=&quot;grid-line&quot; x1=&quot;${state.view.x}&quot; y1=&quot;${y}&quot; x2=&quot;${state.view.x+state.view.w}&quot; y2=&quot;${y}&quot;/&gt;`;
    const origin=map({x:0,y:0});
    html+=`&lt;text class=&quot;axis-label&quot; x=&quot;${origin.x-4}&quot; y=&quot;${origin.y+24}&quot;&gt;(0,0) · P1&lt;/text&gt;&lt;text class=&quot;axis-label&quot; x=&quot;${state.view.x+state.view.w}&quot; y=&quot;${state.view.y+state.view.h+28}&quot; text-anchor=&quot;end&quot;&gt;X →&lt;/text&gt;&lt;text class=&quot;axis-label&quot; x=&quot;${state.view.x-28}&quot; y=&quot;${state.view.y+12}&quot;&gt;Y ↑&lt;/text&gt;`;
    grid.innerHTML=html;
  }

  function layoutViews(){
    if(!el(&#x27;lp-show-mirror&#x27;).checked)return{front:{x:90,y:58,w:580,h:320},back:null};
    const side=el(&#x27;lp-mirror-side&#x27;).value;
    if(side===&#x27;bottom&#x27;)return{front:{x:95,y:35,w:570,h:170},back:{x:95,y:250,w:570,h:170}};
    if(side===&#x27;top&#x27;)return{front:{x:95,y:250,w:570,h:170},back:{x:95,y:35,w:570,h:170}};
    if(side===&#x27;right&#x27;)return{front:{x:35,y:85,w:315,h:275},back:{x:410,y:85,w:315,h:275}};
    return{front:{x:410,y:85,w:315,h:275},back:{x:35,y:85,w:315,h:275}};
  }

  function mirrorCoordinate(p,side,d){
    return side===&#x27;bottom&#x27;||side===&#x27;top&#x27;?{x:p.x,y:d.h-p.y}:{x:d.w-p.x,y:p.y};
  }

  function textWindowMarkup(view,label,rect){
    if(!rect)return&#x27;&#x27;;const topLeft=mapIn({x:rect.x,y:rect.y+rect.h},view),key=label.toLowerCase();state.windowRects[key]={rect:{...rect},view};
    return `&lt;rect class=&quot;text-window&quot; data-window-side=&quot;${key}&quot; x=&quot;${topLeft.x}&quot; y=&quot;${topLeft.y}&quot; width=&quot;${rect.w*topLeft.s}&quot; height=&quot;${rect.h*topLeft.s}&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;coord-label&quot; x=&quot;${topLeft.x+rect.w*topLeft.s/2}&quot; y=&quot;${topLeft.y+rect.h*topLeft.s/2+4}&quot; text-anchor=&quot;middle&quot;&gt;${label} window · bottom-left (${toInput(rect.x).toFixed(1)}, ${toInput(rect.y).toFixed(1)}) ${displayUnit()}&lt;/text&gt;`;
  }

  function qrMarkup(view,result,label){
    if(!result.q)return&#x27;&#x27;;const q=result.q,topLeft=mapIn({x:q.x,y:q.y+q.h},view);
    return `&lt;rect class=&quot;qr-recommendation&quot; x=&quot;${topLeft.x}&quot; y=&quot;${topLeft.y}&quot; width=&quot;${q.w*topLeft.s}&quot; height=&quot;${q.h*topLeft.s}&quot;/&gt;&lt;text class=&quot;point-label&quot; x=&quot;${topLeft.x+q.w*topLeft.s/2}&quot; y=&quot;${topLeft.y+q.h*topLeft.s/2}&quot; text-anchor=&quot;middle&quot;&gt;${label} QR H · ${toInput(q.w).toFixed(1)} ${displayUnit()}&lt;/text&gt;`;
  }

  function cutGuideMarkup(a,b){
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)return&#x27;&#x27;;const nx=-dy/len,ny=dx/len;let out=&#x27;&#x27;;
    for(let t=8;t&lt;len;t+=12){const x=a.x+dx*t/len,y=a.y+dy*t/len;out+=`&lt;line class=&quot;cut-hatch&quot; x1=&quot;${x-nx*5}&quot; y1=&quot;${y-ny*5}&quot; x2=&quot;${x+nx*5}&quot; y2=&quot;${y+ny*5}&quot;/&gt;`;}
    return out;
  }

  function perimeterGuideMarkup(points){
    let out=&#x27;&#x27;;for(let i=0;i&lt;points.length;i++){const a=points[i],b=points[(i+1)%points.length],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)continue;const nx=-dy/len,ny=dx/len;for(let t=6;t&lt;len;t+=12){const x=a.x+dx*t/len,y=a.y+dy*t/len;out+=`&lt;line class=&quot;perimeter-tick&quot; x1=&quot;${x-nx*3.5}&quot; y1=&quot;${y-ny*3.5}&quot; x2=&quot;${x+nx*3.5}&quot; y2=&quot;${y+ny*3.5}&quot;/&gt;`;}}return out;
  }

  function punchMarkup(m,label){
    return `&lt;line class=&quot;punch-mark&quot; x1=&quot;${m.x-12}&quot; y1=&quot;${m.y}&quot; x2=&quot;${m.x+12}&quot; y2=&quot;${m.y}&quot;/&gt;&lt;line class=&quot;punch-mark&quot; x1=&quot;${m.x}&quot; y1=&quot;${m.y-12}&quot; x2=&quot;${m.x}&quot; y2=&quot;${m.y+12}&quot;/&gt;&lt;text class=&quot;coord-label&quot; x=&quot;${m.x+14}&quot; y=&quot;${m.y-12}&quot;&gt;${label} punch centre&lt;/text&gt;`;
  }

  function remainingContentMarkup(view,result,label){
    if(!result.win)return&#x27;&#x27;;const mode=el(&#x27;lp-unused-mode&#x27;).value;if(mode!==&#x27;text&#x27;&amp;&amp;mode!==&#x27;image&#x27;)return&#x27;&#x27;;
    const r=result.win,tl=mapIn({x:r.x,y:r.y+r.h},view),w=r.w*tl.s,h=r.h*tl.s;
    if(mode===&#x27;image&#x27;&amp;&amp;state.unusedImage)return`&lt;image href=&quot;${state.unusedImage}&quot; x=&quot;${tl.x+3}&quot; y=&quot;${tl.y+3}&quot; width=&quot;${Math.max(1,w-6)}&quot; height=&quot;${Math.max(1,h-6)}&quot; preserveAspectRatio=&quot;xMidYMid meet&quot; pointer-events=&quot;none&quot;/&gt;`;
    if(mode===&#x27;text&#x27;){const text=esc(el(&#x27;lp-unused-text&#x27;).value||&#x27;Text&#x27;);return`&lt;text class=&quot;point-label&quot; x=&quot;${tl.x+w/2}&quot; y=&quot;${tl.y+h/2+4}&quot; text-anchor=&quot;middle&quot;&gt;${text}&lt;/text&gt;`;}
    return&#x27;&#x27;;
  }

  function resultText(label,result){
    if(!result.q)return`${label}: no safe QR fit`;
    const q=result.q;return`${label}: ${toInput(q.w).toFixed(1)} × ${toInput(q.h).toFixed(1)} ${displayUnit()} at X ${toInput(q.x).toFixed(1)}, Y ${toInput(q.y).toFixed(1)}`;
  }

  function paperPoint(p,offset,d){return{x:offset.x+p.x,y:offset.y+d.h-p.y};}
  function paperPolygon(poly,offset,d){return poly.map(p=&gt;{const m=paperPoint(p,offset,d);return`${m.x},${m.y}`;}).join(&#x27; &#x27;);}
  function paperRect(rect,offset,d,cls){if(!rect)return&#x27;&#x27;;return`&lt;rect class=&quot;${cls}&quot; x=&quot;${offset.x+rect.x}&quot; y=&quot;${offset.y+d.h-rect.y-rect.h}&quot; width=&quot;${rect.w}&quot; height=&quot;${rect.h}&quot;/&gt;`;}
  function paperCut(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)return&#x27;&#x27;;const nx=-dy/len,ny=dx/len;let out=`&lt;line class=&quot;paper-cut&quot; x1=&quot;${a.x}&quot; y1=&quot;${a.y}&quot; x2=&quot;${b.x}&quot; y2=&quot;${b.y}&quot;/&gt;`;for(let t=2;t&lt;len;t+=2){const x=a.x+dx*t/len,y=a.y+dy*t/len;out+=`&lt;line class=&quot;paper-hatch&quot; x1=&quot;${x-nx}&quot; y1=&quot;${y-ny}&quot; x2=&quot;${x+nx}&quot; y2=&quot;${y+ny}&quot;/&gt;`;}return out;}
  function paperPerimeter(poly,offset,d){const pts=poly.map(p=&gt;paperPoint(p,offset,d));let out=&#x27;&#x27;;for(let i=0;i&lt;pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)continue;const nx=-dy/len,ny=dx/len;for(let t=1.5;t&lt;len;t+=2.5){const x=a.x+dx*t/len,y=a.y+dy*t/len;out+=`&lt;line class=&quot;paper-perimeter&quot; x1=&quot;${x-nx*.7}&quot; y1=&quot;${y-ny*.7}&quot; x2=&quot;${x+nx*.7}&quot; y2=&quot;${y+ny*.7}&quot;/&gt;`;}}return out;}
  function paperHole(hole,offset,d,label){const p=paperPoint(hole,offset,d),r=hole.d/2;return`&lt;circle class=&quot;paper-hole&quot; cx=&quot;${p.x}&quot; cy=&quot;${p.y}&quot; r=&quot;${r}&quot;/&gt;&lt;line class=&quot;paper-punch&quot; x1=&quot;${p.x-r-2}&quot; y1=&quot;${p.y}&quot; x2=&quot;${p.x+r+2}&quot; y2=&quot;${p.y}&quot;/&gt;&lt;line class=&quot;paper-punch&quot; x1=&quot;${p.x}&quot; y1=&quot;${p.y-r-2}&quot; x2=&quot;${p.x}&quot; y2=&quot;${p.y+r+2}&quot;/&gt;&lt;text class=&quot;paper-note&quot; x=&quot;${p.x+r+2.5}&quot; y=&quot;${p.y-r-1}&quot;&gt;${label} punch&lt;/text&gt;`;}

  function renderPaper(outline,hole,frontResult,backOutline,backHole,backResult){
    const paper=el(&#x27;lp-print-sheet&#x27;),paperName=el(&#x27;lp-paper-size&#x27;).value,orientation=el(&#x27;lp-paper-orientation&#x27;).value,base=paperName===&#x27;A4&#x27;?{w:210,h:297}:{w:148,h:210},pw=orientation===&#x27;portrait&#x27;?base.w:base.h,ph=orientation===&#x27;portrait&#x27;?base.h:base.w,d=state.dimensions,gap=fromInput(el(&#x27;lp-fold-gap&#x27;).value),side=el(&#x27;lp-mirror-side&#x27;).value,hasBack=!!backOutline;
    let frontOffset={x:0,y:0},backOffset=null,labelW=d.w,labelH=d.h;
    if(hasBack&amp;&amp;(side===&#x27;bottom&#x27;||side===&#x27;top&#x27;)){labelH=d.h*2+gap;if(side===&#x27;bottom&#x27;)backOffset={x:0,y:d.h+gap};else{backOffset={x:0,y:0};frontOffset={x:0,y:d.h+gap};}}
    if(hasBack&amp;&amp;(side===&#x27;left&#x27;||side===&#x27;right&#x27;)){labelW=d.w*2+gap;if(side===&#x27;right&#x27;)backOffset={x:d.w+gap,y:0};else{backOffset={x:0,y:0};frontOffset={x:d.w+gap,y:0};}}
    const corner=el(&#x27;lp-paper-corner&#x27;).value,mx=fromInput(el(&#x27;lp-paper-x-margin&#x27;).value),my=fromInput(el(&#x27;lp-paper-y-margin&#x27;).value),origin={x:corner.endsWith(&#x27;r&#x27;)?pw-mx-labelW:mx,y:corner.startsWith(&#x27;b&#x27;)?ph-my-labelH:my};
    frontOffset={x:origin.x+frontOffset.x,y:origin.y+frontOffset.y};if(backOffset)backOffset={x:origin.x+backOffset.x,y:origin.y+backOffset.y};
    const decorate=el(&#x27;lp-unused-mode&#x27;).value===&#x27;decor&#x27;,frontWindow=frontResult?.win,backWindow=backResult?.win;
    let label=`&lt;polygon class=&quot;paper-shape&quot; points=&quot;${paperPolygon(outline,frontOffset,d)}&quot;/&gt;${decorate?`&lt;polygon class=&quot;paper-decor&quot; points=&quot;${paperPolygon(outline,frontOffset,d)}&quot;/&gt;`:&#x27;&#x27;}${paperPerimeter(outline,frontOffset,d)}${paperRect(frontResult?.q,frontOffset,d,&#x27;paper-qr&#x27;)}${paperRect(frontWindow,frontOffset,d,&#x27;paper-window&#x27;)}${paperHole(hole,frontOffset,d,&#x27;Front&#x27;)}`;
    if(state.cut){const a=paperPoint(state.points[state.cut[0]],frontOffset,d),b=paperPoint(state.points[state.cut[1]],frontOffset,d);label+=paperCut(a,b);}
    if(backOffset&amp;&amp;backOutline){label+=`&lt;polygon class=&quot;paper-shape&quot; points=&quot;${paperPolygon(backOutline,backOffset,d)}&quot;/&gt;${decorate?`&lt;polygon class=&quot;paper-decor&quot; points=&quot;${paperPolygon(backOutline,backOffset,d)}&quot;/&gt;`:&#x27;&#x27;}${paperPerimeter(backOutline,backOffset,d)}${paperRect(backResult?.q,backOffset,d,&#x27;paper-qr&#x27;)}${paperRect(backWindow,backOffset,d,&#x27;paper-window&#x27;)}${paperHole(backHole,backOffset,d,&#x27;Back&#x27;)}`;
      if(state.cut){const a=paperPoint(backOutline[0],backOffset,d);const mirrorSide=side,ca=paperPoint(mirrorCoordinate(state.points[state.cut[0]],mirrorSide,d),backOffset,d),cb=paperPoint(mirrorCoordinate(state.points[state.cut[1]],mirrorSide,d),backOffset,d);label+=paperCut(ca,cb);}
      if(side===&#x27;bottom&#x27;||side===&#x27;top&#x27;){const fy=origin.y+d.h+gap/2;label+=`&lt;line class=&quot;paper-fold&quot; x1=&quot;${origin.x}&quot; y1=&quot;${fy}&quot; x2=&quot;${origin.x+d.w}&quot; y2=&quot;${fy}&quot;/&gt;`;}
