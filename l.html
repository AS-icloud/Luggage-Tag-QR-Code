  <style>

<body><main class="wrap">

  <section class="card toolbar"><label for="language">Choose a language</label><select id="language" onchange="renderTranslation()"><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="hi">हिन्दी</option><option value="pa">ਪੰਜਾਬੀ</option><option value="ar">العربية</option><option value="zh">简体中文</option><option value="ja">日本語</option></select><span class="muted">The contact details stay in their original form for accuracy; only labels and the recovery message are translated.</span></section>
  <div class="columns">
    <section class="card" id="original"><h2 class="column-title">English / Original</h2></section>
    <section class="card" id="translated"><h2 class="column-title">Translation</h2></section>
  </div>
  <button class="copy" onclick="copyOriginal()">Copy original information</button>
  <button class="copy secondary" onclick="copyTranslated()">Copy translated information</button>
</main><script>
var data={name:'Ankit Srivastava',address1:'B/1\n9 Queens Crescent\nGlasgow, UK\nG4 9BW',address2:'KSkin\n11 Ingram Street\nGlasgow, UK\nG1 1HA',mobile:'+44 (0) 77 62 60 94 90',telephone:'+44 (0) 141 55 25 022',whatsapp:'+44 (0) 77 62 60 94 90',email1:'a_srivastava@icloud.com',email2:'home9crescent@gmail.com',note:'Please contact us via WhatsApp or email if you have found this luggage.'};
var languages={
  en:{title:'English / Original',name:'Name',address1:'Address 1',address2:'Address 2',mobile:'Mobile',telephone:'Telephone',whatsapp:'WhatsApp',email1:'Email 1',email2:'Email 2',note:'Notes',message:data.note,call:'Call',openWhatsApp:'Open WhatsApp',email:'Email',apple:'Apple Maps',google:'Google Maps'},
  es:{title:'Español',name:'Nombre',address1:'Dirección 1',address2:'Dirección 2',mobile:'Móvil',telephone:'Teléfono',whatsapp:'WhatsApp',email1:'Correo electrónico 1',email2:'Correo electrónico 2',note:'Nota',message:'Contacte con nosotros por WhatsApp o correo electrónico si ha encontrado este equipaje.',call:'Llamar',openWhatsApp:'Abrir WhatsApp',email:'Correo',apple:'Apple Maps',google:'Google Maps'},
  fr:{title:'Français',name:'Nom',address1:'Adresse 1',address2:'Adresse 2',mobile:'Portable',telephone:'Téléphone',whatsapp:'WhatsApp',email1:'E-mail 1',email2:'E-mail 2',note:'Remarque',message:'Veuillez nous contacter par WhatsApp ou e-mail si vous avez trouvé ce bagage.',call:'Appeler',openWhatsApp:'Ouvrir WhatsApp',email:'E-mail',apple:'Apple Plans',google:'Google Maps'},
  de:{title:'Deutsch',name:'Name',address1:'Adresse 1',address2:'Adresse 2',mobile:'Mobiltelefon',telephone:'Telefon',whatsapp:'WhatsApp',email1:'E-Mail 1',email2:'E-Mail 2',note:'Hinweis',message:'Bitte kontaktieren Sie uns per WhatsApp oder E-Mail, wenn Sie dieses Gepäck gefunden haben.',call:'Anrufen',openWhatsApp:'WhatsApp öffnen',email:'E-Mail',apple:'Apple Karten',google:'Google Maps'},
  it:{title:'Italiano',name:'Nome',address1:'Indirizzo 1',address2:'Indirizzo 2',mobile:'Cellulare',telephone:'Telefono',whatsapp:'WhatsApp',email1:'E-mail 1',email2:'E-mail 2',note:'Nota',message:'Contattaci tramite WhatsApp o e-mail se hai trovato questo bagaglio.',call:'Chiama',openWhatsApp:'Apri WhatsApp',email:'E-mail',apple:'Mappe Apple',google:'Google Maps'},
  pt:{title:'Português',name:'Nome',address1:'Endereço 1',address2:'Endereço 2',mobile:'Telemóvel',telephone:'Telefone',whatsapp:'WhatsApp',email1:'E-mail 1',email2:'E-mail 2',note:'Nota',message:'Contacte-nos por WhatsApp ou e-mail se encontrou esta bagagem.',call:'Ligar',openWhatsApp:'Abrir WhatsApp',email:'E-mail',apple:'Mapas Apple',google:'Google Maps'},
  hi:{title:'हिन्दी',name:'नाम',address1:'पता 1',address2:'पता 2',mobile:'मोबाइल',telephone:'टेलीफ़ोन',whatsapp:'व्हाट्सऐप',email1:'ईमेल 1',email2:'ईमेल 2',note:'नोट',message:'यदि आपको यह सामान मिला है, तो कृपया व्हाट्सऐप या ईमेल से हमसे संपर्क करें।',call:'कॉल करें',openWhatsApp:'व्हाट्सऐप खोलें',email:'ईमेल',apple:'Apple Maps',google:'Google Maps'},
  pa:{title:'ਪੰਜਾਬੀ',name:'ਨਾਮ',address1:'ਪਤਾ 1',address2:'ਪਤਾ 2',mobile:'ਮੋਬਾਈਲ',telephone:'ਟੈਲੀਫ਼ੋਨ',whatsapp:'WhatsApp',email1:'ਈਮੇਲ 1',email2:'ਈਮੇਲ 2',note:'ਨੋਟ',message:'ਜੇ ਤੁਹਾਨੂੰ ਇਹ ਸਮਾਨ ਮਿਲਿਆ ਹੈ, ਤਾਂ ਕਿਰਪਾ ਕਰਕੇ WhatsApp ਜਾਂ ਈਮੇਲ ਰਾਹੀਂ ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।',call:'ਕਾਲ ਕਰੋ',openWhatsApp:'WhatsApp ਖੋਲ੍ਹੋ',email:'ਈਮੇਲ',apple:'Apple Maps',google:'Google Maps'},
  ar:{title:'العربية',name:'الاسم',address1:'العنوان 1',address2:'العنوان 2',mobile:'الهاتف المحمول',telephone:'الهاتف',whatsapp:'واتساب',email1:'البريد الإلكتروني 1',email2:'البريد الإلكتروني 2',note:'ملاحظة',message:'يرجى التواصل معنا عبر واتساب أو البريد الإلكتروني إذا عثرت على هذه الأمتعة.',call:'اتصال',openWhatsApp:'فتح واتساب',email:'البريد الإلكتروني',apple:'خرائط Apple',google:'خرائط Google'},
  zh:{title:'简体中文',name:'姓名',address1:'地址 1',address2:'地址 2',mobile:'手机',telephone:'电话',whatsapp:'WhatsApp',email1:'电子邮箱 1',email2:'电子邮箱 2',note:'备注',message:'如您找到这件行李，请通过 WhatsApp 或电子邮件联系我们。',call:'拨打电话',openWhatsApp:'打开 WhatsApp',email:'电子邮件',apple:'Apple 地图',google:'Google 地图'},
  ja:{title:'日本語',name:'氏名',address1:'住所 1',address2:'住所 2',mobile:'携帯電話',telephone:'電話',whatsapp:'WhatsApp',email1:'メール 1',email2:'メール 2',note:'メモ',message:'この荷物を見つけた場合は、WhatsApp またはメールでご連絡ください。',call:'電話する',openWhatsApp:'WhatsApp を開く',email:'メール',apple:'Apple マップ',google:'Google マップ'}
};
var languageCodes={s:'es',f:'fr',d:'de',i:'it',p:'pt',h:'hi',u:'pa',a:'ar',c:'zh',j:'ja'};
function applyLanguageBundle(){var requested=new URLSearchParams(location.search).get('l');if(!requested)return;var allowed=requested.split('').map(function(code){return languageCodes[code]}).filter(Boolean);if(allowed.length<5)return;var select=document.getElementById('language');Array.from(select.options).forEach(function(option){option.hidden=allowed.indexOf(option.value)===-1;option.disabled=option.hidden});select.value=allowed[0]}
function digits(v){return v.replace(/\s*\(0\)\s*/,'').replace(/[^\d+]/g,'')}
function esc(v){return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function row(label,value,actions){return '<div class="row"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div>'+(actions?'<div class="actions">'+actions+'</div>':'')+'</div>'}
function renderColumn(target,lang){var t=languages[lang],map1=encodeURIComponent(data.address1),map2=encodeURIComponent(data.address2),rtl=lang==='ar';var html='<div'+(rtl?' dir="rtl"':'')+'><h2 class="column-title">'+t.title+'</h2>';html+=row(t.name,data.name);html+=row(t.address1,data.address1,'<a class="btn" href="https://maps.apple.com/?q='+map1+'">'+t.apple+'</a><a class="btn" href="https://maps.google.com/maps?q='+map1+'">'+t.google+'</a>');html+=row(t.address2,data.address2,'<a class="btn" href="https://maps.apple.com/?q='+map2+'">'+t.apple+'</a><a class="btn" href="https://maps.google.com/maps?q='+map2+'">'+t.google+'</a>');html+=row(t.mobile,data.mobile,'<a class="btn green" href="tel:'+digits(data.mobile)+'">'+t.call+'</a>');html+=row(t.telephone,data.telephone,'<a class="btn green" href="tel:'+digits(data.telephone)+'">'+t.call+'</a>');html+=row(t.whatsapp,data.whatsapp,'<a class="btn green" href="https://wa.me/'+digits(data.whatsapp).replace(/\D/g,'')+'">'+t.openWhatsApp+'</a>');html+=row(t.email1,data.email1,'<a class="btn" href="mailto:'+data.email1+'">'+t.email+'</a>');html+=row(t.email2,data.email2,'<a class="btn" href="mailto:'+data.email2+'">'+t.email+'</a>');html+='<div class="card note" style="margin:14px 0 0"><strong>'+esc(t.message)+'</strong></div></div>';target.innerHTML=html}
function renderTranslation(){renderColumn(document.getElementById('translated'),document.getElementById('language').value)}
function clip(lang){var t=languages[lang];return [t.name+'\n'+data.name,t.address1+'\n'+data.address1,t.address2+'\n'+data.address2,t.mobile+': '+data.mobile,t.telephone+': '+data.telephone,t.whatsapp+': '+data.whatsapp,t.email1+': '+data.email1,t.email2+': '+data.email2,t.note+'\n'+t.message].join('\n\n')}
function copyText(text,message){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){alert(message)});else{var a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert(message)}}
function copyOriginal(){copyText(clip('en'),'Original information copied.')}function copyTranslated(){var l=document.getElementById('language').value;copyText(clip(l),languages[l].title+' translation copied.')}
applyLanguageBundle();renderColumn(document.getElementById('original'),'en');renderTranslation();
</script></body></html>
